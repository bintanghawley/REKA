services:
  postgres:
    image: postgres:16-alpine
    container_name: reka_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reka_db}
      POSTGRES_USER: ${POSTGRES_USER:-reka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

    ports:
      - "5432:5432"

    volumes:
      # Volume persist agar data tidak hilang saat container restart
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reka_user} -d ${POSTGRES_DB:-reka_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
