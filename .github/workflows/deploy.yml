name: Deploy to VPS

on:
  push:
    branches:
      - main # Workflow ini akan dipicu setiap ada push ke branch main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Port default SSH adalah 22, tambahkan jika Anda menggunakan port berbeda
          port: ${{ secrets.VPS_PORT || 22 }}
          # Pergi ke folder aplikasi dan jalankan script deploy.sh
          script: |
            cd /var/www/reka-umkm
            chmod +x deploy.sh
            ./deploy.sh
